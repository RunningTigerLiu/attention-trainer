<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>专注力训练营</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🎯 专注力训练营</div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-view="home">今日训练</button>
    <button class="tab" data-view="library">任务库</button>
    <button class="tab" data-view="analysis">记录与分析</button>
    <button class="tab" data-view="data">设置与数据</button>
    <button class="tab" data-view="help">使用说明</button>
  </nav>
  <div class="who"><span id="whoName" class="muted"></span></div>
</header>

<div id="banner" class="banner hidden"></div>

<main id="main">
  <section id="view-home" class="view"></section>
  <section id="view-library" class="view hidden"></section>
  <section id="view-analysis" class="view hidden"></section>
  <section id="view-data" class="view hidden"></section>
  <section id="view-help" class="view hidden"></section>
</main>

<footer class="foot">
  <span class="muted">本地运行 · 数据只保存在这台电脑上 · 请每周导出备份一次</span>
</footer>

<div id="overlay" class="overlay hidden">
  <div class="stageWrap">
    <div class="stageHead">
      <div>
        <div id="stageTitle" class="stageTitle">任务</div>
        <div id="stageSub" class="stageSub"></div>
      </div>
      <div class="stageHeadRight">
        <div id="stageClock" class="muted small"></div>
        <div id="stageProgressText" class="muted small"></div>
        <button id="stageQuit" class="btn btn-ghost small">退出</button>
      </div>
    </div>
    <div class="progressOuter"><div id="stageProgress" class="progressInner"></div></div>
    <div id="stage" class="stage"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/words.js"></script>
<script src="js/tasks-attention.js"></script>
<script src="js/tasks-memory.js"></script>
<script src="js/tasks-new.js"></script>
<script src="js/tasks-more.js"></script>
<script src="js/plan.js"></script>
<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
